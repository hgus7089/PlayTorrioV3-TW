name: Build Windows Release

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Zip Windows build
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath PlayTorrioV3-Windows-繁中版.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayTorrioV3-Windows-繁中版
          path: PlayTorrioV3-Windows-繁中版.zip
